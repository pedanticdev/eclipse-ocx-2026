services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ocx
      POSTGRES_USER: ocx
      POSTGRES_PASSWORD: ocx
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocx -d ocx"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama-data:
  pg-data:
